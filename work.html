        .lightbox-arrow { color: #333; }
        .lightbox-caption {

        .lightbox-subnav { background: none; }

        /* each image lands with a small squash, like the ball hitting a wall */
        @keyframes land {
            0%   { transform: scale(1.06, 0.9); }
            45%  { transform: scale(0.97, 1.04); }
            75%  { transform: scale(1.01, 0.99); }
            100% { transform: scale(1, 1); }
        }
        .lightbox-image-container img { animation: land 0.45s ease-out; }
        @media (prefers-reduced-motion: reduce) {
            .lightbox-image-container img { animation: none; }
            body { transition: none; }
        }

    <script>
    // A pastel for each visit, and the next one each time the lightbox closes
    document.addEventListener("DOMContentLoaded", () => {
        const PASTELS = [
            [255, 216, 228], [207, 232, 255], [253, 243, 181],
            [213, 245, 227], [230, 220, 255], [255, 220, 199],
        ];
        let i = Math.floor(Math.random() * PASTELS.length);
        const apply = () => {
            const [r, g, b] = PASTELS[i];
            document.documentElement.style.setProperty("--page", `rgb(${r}, ${g}, ${b})`);
            document.documentElement.style.setProperty("--page-rgb", `${r}, ${g}, ${b}`);
        };
        apply();
        const lightbox = document.querySelector(".lightbox");
        if (!lightbox) return;
        let open = false;
        new MutationObserver(() => {
            const nowOpen = lightbox.classList.contains("active");
            if (open && !nowOpen) {
                i = (i + 1) % PASTELS.length;
                apply();
            }
            open = nowOpen;
        }).observe(lightbox, { attributes: true, attributeFilter: ["class"] });
    });
    </script>
