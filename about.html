<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Angus McBryde</title>
    <link rel="stylesheet" href="css/style.css">

        <!-- Favicon -->
    <link rel="icon" type="image/ico" sizes="32x32" href="/favicon-32x32.ico">
    <link rel="icon" type="image/ico" sizes="16x16" href="/favicon-16x16.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.webp">
    

    <style>
        /* About page: a short bio set large across the top, and a portrait you can throw */
        body { transition: background-color 0.15s ease; overflow-x: hidden; }
        header { background-color: transparent; position: relative; z-index: 2; }
        .about-page {
            display: block;
            max-width: none;
            padding: 48px 40px 56px;
        }
        .about-bio p {
            max-width: 22em;
            margin: 0 0 0.5em;
            font-size: clamp(30px, 4.6vw, 72px);
            line-height: 1.08;
            letter-spacing: -0.025em;
            color: #333;
            text-wrap: pretty;
        }
        .about-bio p:last-child { margin-bottom: 0; }
        .about-bio a {
            text-decoration: underline;
            text-decoration-thickness: 0.06em;
            text-underline-offset: 0.12em;
        }
        .about-page .contact-icons {
            justify-content: center;
            margin-top: 56px;
            position: relative;
            z-index: 2;
        }
        /* the icons have white backgrounds; multiply lets the page colour show through them */
        header,
        .about-page .contact-icons { mix-blend-mode: multiply; }
        .ball {
            --d: clamp(110px, 15vw, 210px);
            position: fixed;
            left: 0;
            top: 0;
            width: var(--d);
            height: var(--d);
            margin: calc(var(--d) / -2) 0 0 calc(var(--d) / -2);
            border-radius: 50%;
            overflow: hidden;
            z-index: 5;
            cursor: grab;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            will-change: transform;
            visibility: hidden;
        }
        .ball.ready { visibility: visible; }
        .ball.dragging { cursor: grabbing; }
        .ball .spin { position: absolute; inset: 0; }
        .ball img {
            position: absolute;
            width: 145%;
            max-width: none;
            height: auto;
            left: -27.5%;
            top: -10%;
            pointer-events: none;
            -webkit-user-drag: none;
        }
        @media (max-width: 768px) {
            .about-page { padding: 28px 20px 40px; }
            .about-page .contact-icons { margin-top: 40px; }
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html"><img src="images/logo.webp" alt="Angus McBryde"></a></h1>
        <nav class="menu">
            <a href="work.html">
                <img src="images/icon-work.webp" alt="Work">
            </a>
        </nav>
    </header>

    <main class="about-page">
        <section class="about-bio">
            <p>I work at <a href="https://bandonthewall.org" target="_blank" rel="noopener">Band on the Wall</a>, a music venue and promoter, where I spend much of my time thinking about design, music, culture and how to bring interesting things into the world.</p>
        </section>

        <nav class="menu contact-icons" aria-label="More">
            <a href="music.html">
                <img src="images/icon-music2.webp" alt="Music">
            </a>
            <a href="mailto:hello.angus@pm.me">
                <img src="images/icon-contact.webp" alt="email">
            </a> 
            <a href="https://www.linkedin.com/in/angusmcbryde/" target="_blank">
                <img src="images/icon-linkedin.webp" alt="LinkedIn">
            </a>
        </nav>
    </main>


    <div class="ball" role="img" aria-label="Illustrated portrait of Angus McBryde">
        <div class="spin"><img src="images/portrait.webp" alt=""></div>
    </div>

    <script>
    (() => {
        const el = document.querySelector(".ball");
        const spin = el.querySelector(".spin");
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
        const THEMES = ["#ffffff", "#ffd8e4", "#cfe8ff", "#fdf3b5", "#d5f5e3", "#e6dcff", "#ffdcc7"];
        const GRAVITY = 1500, SUBSTEPS = 4, WALL_K = 1100, WALL_C = 9, FRICTION = 0.3;

        let W = innerWidth, H = innerHeight, R = el.offsetWidth / 2;
        let I = 0.5 * R * R;
        const b = { x: W * 0.72, y: H * 0.35, vx: 0, vy: 0, a: 0, w: 0, dir: Math.random() < 0.5 ? -1 : 1, lastRepel: 0 };
        const press = { l: 0, r: 0, t: 0, b: 0 }, touching = {};
        let theme = 0, drag = null, floor = false, side = 0, last = 0;
        const pointer = { x: 0, y: 0, t: 0 };

        const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
        function nextTheme() {
            theme = (theme + 1) % THEMES.length;
            document.body.style.backgroundColor = THEMES[theme];
        }

        /* sound */
        let ac = null, lastThud = 0;
        function armAudio() {
            if (!ac) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return;
                try { ac = new C(); } catch { return; }
            }
            if (ac.state !== "running") ac.resume().catch(() => {});
        }
        function thud(speed) {
            if (!ac || ac.state !== "running") return;
            const now = performance.now();
            if (now - lastThud < 40) return;
            lastThud = now;
            const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
            o.frequency.setValueAtTime(240, t);
            o.frequency.exponentialRampToValueAtTime(80, t + 0.1);
            g.gain.setValueAtTime(Math.min(0.24, 0.04 + speed / 8000), t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
            o.connect(g).connect(ac.destination);
            o.start(t); o.stop(t + 0.13);
        }

        /* physics: a heavy, springy ball */
        function impulse(rx, ry, jx, jy) {
            b.vx += jx; b.vy += jy;
            b.w += (rx * jy - ry * jx) / I;
        }
        function walls(dt, impacts) {
            const sides = [
                ["l", R - b.x, 1, 0],
                ["r", b.x + R - W, -1, 0],
                ["t", R - b.y, 0, 1],
                ["b", b.y + R - H, 0, -1],
            ];
            const maxPen = R * 0.5;
            for (const [key, pen, nx, ny] of sides) {
                press[key] = clamp(pen, 0, maxPen);
                if (pen <= 0) { touching[key] = false; continue; }
                if (key === "b") floor = true;
                if (key === "l") side = -1;
                if (key === "r") side = 1;
                const rx = -nx * R, ry = -ny * R;
                const vn = (b.vx - b.w * ry) * nx + (b.vy + b.w * rx) * ny;
                if (!touching[key]) {
                    touching[key] = true;
                    if (-vn > 220) impacts.push(-vn);
                }
                const jn = Math.max(0, WALL_K * pen - WALL_C * vn) * dt;
                impulse(rx, ry, jn * nx, jn * ny);
                const tx = -ny, ty = nx;
                const vt = (b.vx - b.w * ry) * tx + (b.vy + b.w * rx) * ty;
                const rt = rx * ty - ry * tx;
                const jt = clamp(-vt / (1 + (rt * rt) / I), -FRICTION * jn, FRICTION * jn);
                impulse(rx, ry, jt * tx, jt * ty);
                if (pen > maxPen) {
                    b.x += nx * (pen - maxPen);
                    b.y += ny * (pen - maxPen);
                    const v = b.vx * nx + b.vy * ny;
                    if (v < 0) { b.vx -= v * nx; b.vy -= v * ny; }
                }
            }
        }
        function dragStep(dt) {
            const c = Math.cos(b.a), s = Math.sin(b.a);
            const rx = c * drag.lx - s * drag.ly, ry = s * drag.lx + c * drag.ly;
            const px = b.x + rx, py = b.y + ry;
            const vpx = b.vx - b.w * ry, vpy = b.vy + b.w * rx;
            const k = 0.25 / dt;
            const dvx = (pointer.x - px) * k - vpx, dvy = (pointer.y - py) * k - vpy;
            const k11 = 1 + (ry * ry) / I, k22 = 1 + (rx * rx) / I, k12 = -(rx * ry) / I;
            const det = k11 * k22 - k12 * k12 || 1e-9;
            impulse(rx, ry, ((k22 * dvx - k12 * dvy) / det) * 0.9, ((k11 * dvy - k12 * dvx) / det) * 0.9);
            b.w *= 0.985;
        }
        function step(dt) {
            const impacts = [];
            floor = false; side = 0;
            for (let i = 0; i < SUBSTEPS; i++) {
                const h = dt / SUBSTEPS;
                b.vy += GRAVITY * h;
                b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h;
                b.w *= 0.9993;
                if (drag) dragStep(h);
                walls(h, impacts);
            }
            if (impacts.length) { const s = Math.max(...impacts); nextTheme(); thud(s); }
            // resting on the floor it rolls slowly; touching a side wall pushes it back and changes the colour
            if (!drag && !reduceMotion.matches) {
                if (floor) b.vx += (b.dir * 70 - b.vx) * 0.03;
                const now = performance.now();
                if (side && side === b.dir && now - b.lastRepel > 700) {
                    b.dir = -b.dir;
                    b.lastRepel = now;
                    b.vx = b.dir * 260;
                    b.vy -= 120;
                    nextTheme();
                    thud(400);
                }
            }
        }
        function render() {
            const sxRaw = 1 - (press.l + press.r) / (2 * R);
            const syRaw = 1 - (press.t + press.b) / (2 * R);
            const sx = sxRaw * (1 + 0.5 * (1 - syRaw));
            const sy = syRaw * (1 + 0.5 * (1 - sxRaw));
            const cx = b.x + (press.l - press.r) / 2;
            const cy = b.y + (press.t - press.b) / 2;
            el.style.transform = `translate(${cx}px, ${cy}px) scale(${sx}, ${sy})`;
            spin.style.transform = `rotate(${b.a}rad)`;
        }
        function frame(now) {
            const dt = last ? Math.min(1 / 30, (now - last) / 1000) : 1 / 60;
            last = now;
            step(dt);
            render();
            requestAnimationFrame(frame);
        }

        /* input */
        el.addEventListener("pointerdown", (e) => {
            armAudio();
            if (drag) return;
            try { el.setPointerCapture(e.pointerId); } catch {}
            const dx = e.clientX - b.x, dy = e.clientY - b.y;
            const c = Math.cos(-b.a), s = Math.sin(-b.a);
            drag = { id: e.pointerId, lx: c * dx - s * dy, ly: s * dx + c * dy };
            Object.assign(pointer, { x: e.clientX, y: e.clientY, t: performance.now() });
            el.classList.add("dragging");
            e.preventDefault();
        });
        el.addEventListener("pointermove", (e) => {
            if (!drag || drag.id !== e.pointerId) return;
            Object.assign(pointer, { x: e.clientX, y: e.clientY, t: performance.now() });
        });
        const release = (e) => {
            if (!drag || drag.id !== e.pointerId) return;
            if (performance.now() - pointer.t > 90) { b.vx *= 0.3; b.vy *= 0.3; b.w *= 0.5; }
            drag = null;
            el.classList.remove("dragging");
        };
        el.addEventListener("pointerup", release);
        el.addEventListener("pointercancel", release);

        addEventListener("resize", () => {
            W = innerWidth; H = innerHeight;
            R = el.offsetWidth / 2; I = 0.5 * R * R;
        });
        el.classList.add("ready");
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
